const M = (o) => new THREE.MeshStandardMaterial(o);

function lathe(pts, m, seg = 64) { return new THREE.Mesh(new THREE.LatheGeometry(pts.map(([x, y]) => new THREE.Vector2(x, y)), seg), m); }

  'badge-green': () => badge('#39ff88', 1), 'badge-cyan': () => badge('#3ee6ff', 2), 'badge-violet': () => badge('#b45cff', 3), 'badge-gold': () => badge('#ffcf4a', 3, true), 'badge-red': () => badge('#ff3a4a', 2, true),

// the CTRL wing mark (and the lockup) drawn into a canvas, for prints, plaques and light boxes
function markCanvas(fg = '#ffffff', bg = null, lockup = false, W = 512) {
  const A = CtrlArt, vb = lockup ? [0, 0, 2540, 3532] : A.MARK.vb;
  const H = Math.round(W * (lockup ? 1.25 : 1)), c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'); if (bg) { x.fillStyle = bg; x.fillRect(0, 0, W, H); }
  const k = Math.min(W * 0.8 / vb[2], H * 0.8 / vb[3]);
  x.translate(W / 2 - (vb[0] + vb[2] / 2) * k, H / 2 - (vb[1] + vb[3] / 2) * k); x.scale(k, k); x.fillStyle = fg;
  x.fill(new Path2D(A.MARK.d), 'evenodd'); if (lockup) x.fill(new Path2D(A.WORD.d), 'evenodd');
  return c;
}
const ctex = c => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
// a bot's hidden parts (parked far off) would stretch the bounds the camera frames

}
